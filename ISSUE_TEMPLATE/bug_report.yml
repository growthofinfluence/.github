name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Use made up data. Never paste a real credential.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: "v1.2.0, macOS 15, Python 3.12"
    validations:
      required: true
